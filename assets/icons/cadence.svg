<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
    <radialGradient id="indigo" cx="230" cy="210" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta" cx="900" cy="420" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="420" cy="960" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="10"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="#1a1530"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#indigo)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#magenta)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#amber)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <g filter="url(#glow)" fill="none" stroke="#ffffff" stroke-linecap="round" transform="translate(40 0)">
    <path d="M 637 295.5 A 250 250 0 1 0 637 728.5" stroke-width="88"/>
    <g stroke-width="56">
      <line x1="458" y1="548" x2="458" y2="476"/>
      <line x1="554" y1="590" x2="554" y2="434"/>
      <line x1="650" y1="632" x2="650" y2="392"/>
    </g>
