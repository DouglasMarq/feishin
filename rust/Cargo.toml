[workspace]
resolver = "3"
members = [
    "app",
    "crates/api",
    "crates/api-jellyfin",
    "crates/api-navidrome",
    "crates/api-subsonic",
    "crates/core",
    "crates/lyrics",
    "crates/platform",
    "crates/player",
    "crates/storage",
    "spikes/ui-slint",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
feishin-api = { path = "crates/api" }
feishin-api-jellyfin = { path = "crates/api-jellyfin" }
feishin-api-navidrome = { path = "crates/api-navidrome" }
feishin-api-subsonic = { path = "crates/api-subsonic" }
feishin-core = { path = "crates/core" }
feishin-lyrics = { path = "crates/lyrics" }
feishin-platform = { path = "crates/platform" }
feishin-player = { path = "crates/player" }
feishin-storage = { path = "crates/storage" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
min_ident_chars = "deny"
too_many_lines = "deny"
